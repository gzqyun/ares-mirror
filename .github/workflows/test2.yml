name: Test Access v2

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Deep test
        run: |
          set +e
          mkdir -p out
          {
            echo "=== DNS ==="
            getent hosts www.theares.com.tw
            nslookup www.theares.com.tw 2>&1 | head -10
            echo ""
            echo "=== curl verbose head ==="
            curl -sv -I -m 25 "https://www.theares.com.tw/@resource/css/ares.css" 2>&1 | head -30
            echo ""
            echo "=== body size test ==="
            curl -s -o /dev/null -w "http_code=%{http_code} size=%{size_download} time=%{time_total}\n" -m 25 "https://www.theares.com.tw/" 2>&1
            echo ""
            echo "=== http instead of https ==="
            curl -s -o /dev/null -w "http_code=%{http_code} size=%{size_download}\n" -m 25 "http://www.theares.com.tw/" 2>&1
          } > out/report.txt 2>&1
          cat out/report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: out/report.txt
