name: Test Access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test connectivity
        run: |
          echo "=== DNS ==="
          nslookup www.theares.com.tw 2>&1 | head -6
          echo "=== curl test ==="
          curl -sI -m 20 "https://www.theares.com.tw/@resource/css/ares.css" 2>&1 | head -10 || echo "curl failed"
          echo "=== curl exit code ==="
          curl -s -o /dev/null -w "%{http_code}" -m 20 "https://www.theares.com.tw/" 2>&1 || true
