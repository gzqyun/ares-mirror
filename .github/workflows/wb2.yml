            "@resource/images/@ico/profile.svg" \
            "@resource/images/@ico/weapon01-1.png" \
            "@resource/images/@ico/weapon01-2.png" \
            "@resource/images/@ico/weapon02-1.png" \
            "@resource/images/@ico/weapon02-2.png" \
            "@resource/images/@ico/weapon03-1.png" \
            "@resource/images/@ico/weapon03-2.png" \
            "@resource/images/@ico/weapon04-1.png" \
            "@resource/images/@ico/weapon04-2.png" \
            "@resource/images/@ico/suit-line.png" \
            "@resource/images/main/ico_apple_black.png" \
            "@resource/images/main/ico_playstore_black.png" \
            "@resource/images/main/ico_window_black.png" \
            "@resource/images/share_img.png" \
            "@resource/js/inc.js" \
            "include/img/alert/alert_03.png" \
            ; do
            mkdir -p "mirror/$(dirname "$path")"
            # wayback 快照URL
            curl -sL --max-time 40 -A "Mozilla/5.0" \
              -o "mirror/$path" \
              "https://web.archive.org/web/${SNAP}id_/https://www.theares.com.tw/$path"
            size=$(stat -c %s "mirror/$path" 2>/dev/null || echo 0)
            head -c 20 "mirror/$path" | grep -q "Not Found\|not found" && rm -f "mirror/$path"
            if [ -s "mirror/$path" ]; then
              ok=$((ok+1))
              echo "OK   $path ($size B)"
            else
              rm -f "mirror/$path"
              fail=$((fail+1))
              echo "FAIL $path"
            fi
          done
          echo "=== summary: ok=$ok fail=$fail ==="
      - name: Package
        run: |
          tar -czf theares-mirror.tar.gz mirror
          du -sh mirror
          ls -la theares-mirror.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: theares-mirror
          path: theares-mirror.tar.gz
          retention-days: 14
