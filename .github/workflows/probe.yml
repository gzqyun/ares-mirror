name: TLS Probe

"on":
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: TLS variations
        run: |
          set +e
          mkdir -p out
          {
            echo "=== 1. TLS 1.2 ==="
            curl -s --tlsv1.2 --tls-max 1.2 -o /dev/null -w "code=%{http_code} err=%{errormsg}\n" -m 20 "https://www.theares.com.tw/@resource/css/ares.css"
            echo "=== 2. TLS 1.3 only ==="
            curl -s --tlsv1.3 -o /dev/null -w "code=%{http_code} err=%{errormsg}\n" -m 20 "https://www.theares.com.tw/@resource/css/ares.css"
            echo "=== 3. HTTP/1.1 only ==="
            curl -s --http1.1 -o /dev/null -w "code=%{http_code} err=%{errormsg}\n" -m 20 "https://www.theares.com.tw/@resource/css/ares.css"
            echo "=== 4. no-keepalive ==="
            curl -s --no-keepalive -o /dev/null -w "code=%{http_code} err=%{errormsg}\n" -m 20 "https://www.theares.com.tw/@resource/css/ares.css"
            echo "=== 5. old cipher list ==="
            curl -s --ciphers "ECDHE-RSA-AES128-GCM-SHA256" -o /dev/null -w "code=%{http_code} err=%{errormsg}\n" -m 20 "https://www.theares.com.tw/@resource/css/ares.css"
            echo "=== 6. http2 ==="
            curl -s --http2 -o /dev/null -w "code=%{http_code} err=%{errormsg}\n" -m 20 "https://www.theares.com.tw/@resource/css/ares.css"
            echo "=== 7. naked domain ==="
            curl -s -o /dev/null -w "code=%{http_code} err=%{errormsg}\n" -m 20 "https://theares.com.tw/@resource/css/ares.css"
            echo "=== 8. resolve+SNI ==="
            curl -s --resolve www.theares.com.tw:443:34.36.109.170 -o /dev/null -w "code=%{http_code} err=%{errormsg}\n" -m 20 "https://www.theares.com.tw/@resource/css/ares.css"
            echo "=== 9. wget ==="
            timeout 20 wget -q --no-check-certificate -O /tmp/t.css "https://www.theares.com.tw/@resource/css/ares.css" 2>&1 | tail -3
            echo "wget exit: $?"
            echo "=== 10. python ==="
            python3 -c "
import urllib.request, ssl
try:
    ctx = ssl.create_default_context()
    ctx.check_hostname = False
    ctx.verify_mode = ssl.CERT_NONE
    r = urllib.request.urlopen('https://www.theares.com.tw/@resource/css/ares.css', timeout=20, context=ctx)
    print('python OK', r.status, len(r.read()))
except Exception as e:
    print('python FAIL', type(e).__name__, str(e)[:200])
"
          } > out/probe.txt 2>&1
          cat out/probe.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: out/probe.txt
