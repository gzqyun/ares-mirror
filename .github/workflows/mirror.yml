            ; do
            mkdir -p "$(dirname "$path")"
            code=$(curl -sL --max-time 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0" \
              -o "$path" -w "%{http_code}" "https://www.theares.com.tw/$path")
            size=$(stat -c %s "$path" 2>/dev/null || echo 0)
            if [ "$code" = "200" ] && [ "$size" -gt 100 ]; then
              echo "OK   $path ($size B)"
            else
              rm -f "$path"
              echo "FAIL $code $path"
              fail=1
            fi
          done
          echo "fail_flag=$fail"

      - name: Package
        run: |
          cd mirror
          cp ../probe.txt . 2>/dev/null || true
          tar -czf /tmp/theares-mirror.tar.gz .
          du -sh /tmp/theares-mirror.tar.gz
          ls -la /tmp/theares-mirror.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: theares-mirror
          path: /tmp/theares-mirror.tar.gz
          retention-days: 14
